name: Validate production build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - run: node .yarn/releases/yarn-4.18.1.cjs lint
      - run: node .yarn/releases/yarn-4.18.1.cjs build
      - run: node .yarn/releases/yarn-4.18.1.cjs typecheck
      - name: Smoke test production server
        shell: bash
        run: |
          node .yarn/releases/yarn-4.18.1.cjs serve > /tmp/website-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/website-server.log
            exit 1
          fi
          node .yarn/releases/yarn-4.18.1.cjs smoke
